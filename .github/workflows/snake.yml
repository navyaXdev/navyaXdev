name: Generate Contribution Snake

on:
  schedule:
    # Run once every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: navyaXdev
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#BFC8D2&color_dots=#11151B,#171D25,#29323E,#66D9EF,#F2F4F7

      - name: Deploy SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

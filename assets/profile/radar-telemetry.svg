<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0D" />
      <stop offset="50%" stop-color="#0E1217" />
      <stop offset="100%" stop-color="#080A0D" />
    </linearGradient>

    <!-- Radar Sweep Cone Gradient -->
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66D9EF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#BFC8D2" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#BFC8D2" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes sweepRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blipAlert {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes ekgPulse {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingWave {
      0% { r: 5; opacity: 0.8; }
      100% { r: 85; opacity: 0; }
    }

    .radar-sweep {
      transform-origin: 150px 140px;
      animation: sweepRotate 9s linear infinite;
    }
    .blip-alert {
      transform-origin: 195px 95px;
      animation: blipAlert 2s ease-in-out infinite;
    }
    .blip-auth {
      transform-origin: 180px 175px;
      animation: blipAlert 2.5s ease-in-out infinite;
    }
    .ekg-line {
      stroke-dasharray: 20 6;
      animation: ekgPulse 3.5s linear infinite;
    }
    .expanding-ping {
      animation: pingWave 4s ease-out infinite;
    }
  </style>

  <!-- Base Panel -->
  <rect x="0" y="0" width="960" height="260" rx="10" fill="url(#radarBg)" stroke="#29323E" stroke-width="1.2" />

  <!-- Title Header Bar -->
  <rect x="0" y="0" width="960" height="34" rx="10" fill="#11151B" />
  <rect x="0" y="24" width="960" height="10" fill="#11151B" />
  <line x1="0" y1="34" x2="960" y2="34" stroke="#29323E" stroke-width="1" />

  <text x="24" y="22" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">
    RADAR_TELEMETRY // RF SPECTRUM &amp; DEFENSIVE MATRIX
  </text>
  <text x="936" y="22" fill="#66D9EF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="500" text-anchor="end">
    SWEEP: 360° · REALTIME TELEMETRY
  </text>

  <!-- ==================== PANEL 1: SCANNING RADAR ==================== -->
  <g transform="translate(0, 0)">
    <text x="150" y="52" fill="#929DAA" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle" font-weight="600">
      RF DETECTOR [ESP32 802.11 IDS]
    </text>

    <!-- Range Rings -->
    <circle cx="150" cy="140" r="85" fill="none" stroke="#1D242E" stroke-width="1" />
    <circle cx="150" cy="140" r="58" fill="none" stroke="#1D242E" stroke-width="1" stroke-dasharray="2 3" />
    <circle cx="150" cy="140" r="28" fill="none" stroke="#29323E" stroke-width="1" />
    
    <!-- Crosshairs -->
    <line x1="150" y1="50" x2="150" y2="230" stroke="#1D242E" stroke-width="0.8" />
    <line x1="60" y1="140" x2="240" y2="140" stroke="#1D242E" stroke-width="0.8" />

    <!-- Degree Markings -->
    <text x="150" y="47" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">0° N</text>
    <text x="248" y="142" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="7" alignment-baseline="middle">90° E</text>
    <text x="150" y="238" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">180° S</text>
    <text x="52" y="142" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="end" alignment-baseline="middle">270° W</text>

    <!-- Expanding Signal Wave -->
    <circle cx="150" cy="140" r="5" fill="none" stroke="#BFC8D2" stroke-width="1" class="expanding-ping" />

    <!-- Rotating Radar Sweep Cone -->
    <g class="radar-sweep" style="transform-origin: 150px 140px;">
      <path d="M 150 140 L 235 140 A 85 85 0 0 0 210 80 Z" fill="url(#sweepGrad)" />
      <line x1="150" y1="140" x2="235" y2="140" stroke="#BFC8D2" stroke-width="1.5" opacity="0.8" />
    </g>

    <!-- Radar Target 1: Deauth Attack Blocked -->
    <g class="blip-alert">
      <circle cx="195" cy="95" r="4" fill="#FF5555" />
      <circle cx="195" cy="95" r="7" fill="none" stroke="#FF5555" stroke-width="0.8" />
    </g>
    <text x="208" y="98" fill="#FF8888" font-family="'JetBrains Mono', Consolas, monospace" font-size="7.5" font-weight="600">DEAUTH_DETECTED</text>

    <!-- Radar Target 2: Authorized Node -->
    <g class="blip-auth">
      <circle cx="180" cy="175" r="3.5" fill="#66D9EF" />
    </g>
    <text x="190" y="186" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="7.5">AUTHORIZED</text>
  </g>

  <!-- Divider 1 -->
  <line x1="300" y1="46" x2="300" y2="246" stroke="#29323E" stroke-width="1" stroke-dasharray="3 4" />

  <!-- ==================== PANEL 2: TELEMETRY & GAUGES ==================== -->
  <g transform="translate(325, 48)">
    <text x="0" y="10" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">
      ACTIVE DEFENSIVE METRICS
    </text>

    <!-- Gauge 1: 802.11 Surveillance -->
    <g transform="translate(0, 24)">
      <text x="0" y="10" fill="#F2F4F7" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="500">802.11 RF Intrusion Surveillance</text>
      <text x="280" y="10" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end">98% ACTIVE</text>
      <rect x="0" y="16" width="280" height="6" rx="3" fill="#11151B" stroke="#29323E" stroke-width="1" />
      <rect x="1" y="17" width="272" height="4" rx="2" fill="#BFC8D2" />
    </g>

    <!-- Gauge 2: Isolation Forest Accuracy -->
    <g transform="translate(0, 66)">
      <text x="0" y="10" fill="#F2F4F7" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="500">Ghost-Guard Isolation Forest Model</text>
      <text x="280" y="10" fill="#66D9EF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end">96.4% ACC</text>
      <rect x="0" y="16" width="280" height="6" rx="3" fill="#11151B" stroke="#29323E" stroke-width="1" />
      <rect x="1" y="17" width="268" height="4" rx="2" fill="#66D9EF" />
    </g>

    <!-- Gauge 3: Python Automation -->
    <g transform="translate(0, 108)">
      <text x="0" y="10" fill="#F2F4F7" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="500">Python Scripting &amp; Automation</text>
      <text x="280" y="10" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end">ACTIVE LEARNING</text>
      <rect x="0" y="16" width="280" height="6" rx="3" fill="#11151B" stroke="#29323E" stroke-width="1" />
      <rect x="1" y="17" width="260" height="4" rx="2" fill="#BFC8D2" />
    </g>

    <!-- Gauge 4: Zero Trust Uptime -->
    <g transform="translate(0, 150)">
      <text x="0" y="10" fill="#F2F4F7" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="500">Mornye Zero-Trust Tunnel Uptime</text>
      <text x="280" y="10" fill="#66D9EF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end">99.98% SLA</text>
      <rect x="0" y="16" width="280" height="6" rx="3" fill="#11151B" stroke="#29323E" stroke-width="1" />
      <rect x="1" y="17" width="276" height="4" rx="2" fill="#66D9EF" />
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="640" y1="46" x2="640" y2="246" stroke="#29323E" stroke-width="1" stroke-dasharray="3 4" />

  <!-- ==================== PANEL 3: IDENTITY & PORTFOLIO INTEGRATION ==================== -->
  <g transform="translate(665, 48)">
    <text x="0" y="10" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">
      OPERATOR CREDENTIALS
    </text>

    <!-- Identity Information -->
    <g transform="translate(0, 24)" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">
      <text x="0" y="10" fill="#929DAA">OPERATOR:</text>
      <text x="80" y="10" fill="#F2F4F7" font-weight="600">Dinesh Patra</text>

      <text x="0" y="28" fill="#929DAA">HANDLE:</text>
      <text x="80" y="28" fill="#BFC8D2" font-weight="600">@navyaXdev</text>

      <text x="0" y="46" fill="#929DAA">PORTFOLIO:</text>
      <text x="80" y="46" fill="#66D9EF" font-weight="600">portfolio.navya.dpdns.org</text>

      <text x="0" y="64" fill="#929DAA">HONORS:</text>
      <text x="80" y="64" fill="#BFC8D2" font-weight="600">NYC CodeQuest R3 Qualifier</text>

      <text x="0" y="82" fill="#929DAA">NATIONAL:</text>
      <text x="80" y="82" fill="#F2F4F7">Smart India Hackathon</text>

      <text x="0" y="100" fill="#929DAA">STATUS:</text>
      <text x="80" y="100" fill="#BFC8D2" font-weight="600">Available for Opportunities</text>
    </g>

    <!-- EKG Heartbeat Line -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="265" height="38" rx="4" fill="#0C0F14" stroke="#29323E" stroke-width="1" />
      <text x="8" y="14" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="8">TELEMETRY_PULSE // 100% NOMINAL</text>
      <path d="M 8 28 L 60 28 L 70 21 L 78 34 L 86 18 L 94 29 L 102 28 L 150 28 L 160 21 L 168 34 L 176 18 L 184 29 L 192 28 L 255 28" 
            fill="none" stroke="#BFC8D2" stroke-width="1.3" class="ekg-line" />
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="50%" stop-color="#0A101C" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Radar Sweep Cone Gradient -->
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <filter id="blipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweepRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blipAlert {
      0%, 100% { opacity: 0.1; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes ekgPulse {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingWave {
      0% { r: 5; opacity: 0.9; }
      100% { r: 90; opacity: 0; }
    }

    .radar-sweep {
      transform-origin: 150px 130px;
      animation: sweepRotate 6s linear infinite;
    }
    .blip-red {
      transform-origin: 195px 85px;
      animation: blipAlert 1.8s ease-in-out infinite;
    }
    .blip-amber {
      transform-origin: 105px 175px;
      animation: blipAlert 2.4s ease-in-out infinite;
    }
    .blip-green {
      transform-origin: 210px 150px;
      animation: blipAlert 2.1s ease-in-out infinite;
    }
    .ekg-line {
      stroke-dasharray: 20 6;
      animation: ekgPulse 3s linear infinite;
    }
    .expanding-ping {
      animation: pingWave 3s ease-out infinite;
    }
  </style>

  <!-- Base Panel -->
  <rect x="0" y="0" width="960" height="260" rx="10" fill="url(#radarBg)" stroke="#1B2838" stroke-width="1.5" />

  <!-- Title Header Bar -->
  <rect x="0" y="0" width="960" height="34" rx="10" fill="#0D1320" />
  <rect x="0" y="24" width="960" height="10" fill="#0D1320" />
  <line x1="0" y1="34" x2="960" y2="34" stroke="#1B2838" stroke-width="1" />

  <text x="24" y="22" fill="#00E5FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700">
    RADAR_TELEMETRY // RF SPECTRUM &amp; DEFENSE MATRIX
  </text>
  <text x="936" y="22" fill="#B7FF5A" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" text-anchor="end">
    SWEEP: 360° · REALTIME
  </text>

  <!-- ==================== PANEL 1: CIRCULAR SCANNING RADAR ==================== -->
  <g transform="translate(0, 0)">
    <!-- Radar Sub-label -->
    <text x="150" y="52" fill="#8793A5" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle" font-weight="600">
      RF DETECTOR [ESP32 802.11 IDS]
    </text>

    <!-- Concentric Target Range Rings -->
    <circle cx="150" cy="140" r="85" fill="none" stroke="#16283D" stroke-width="1" />
    <circle cx="150" cy="140" r="58" fill="none" stroke="#16283D" stroke-width="1" stroke-dasharray="2 3" />
    <circle cx="150" cy="140" r="28" fill="none" stroke="#1B3652" stroke-width="1" />
    
    <!-- Crosshairs -->
    <line x1="150" y1="50" x2="150" y2="230" stroke="#16283D" stroke-width="0.8" />
    <line x1="60" y1="140" x2="240" y2="140" stroke="#16283D" stroke-width="0.8" />

    <!-- Degree Markings -->
    <text x="150" y="47" fill="#8793A5" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">0° N</text>
    <text x="248" y="142" fill="#8793A5" font-family="'JetBrains Mono', monospace" font-size="7" alignment-baseline="middle">90° E</text>
    <text x="150" y="238" fill="#8793A5" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">180° S</text>
    <text x="52" y="142" fill="#8793A5" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="end" alignment-baseline="middle">270° W</text>

    <!-- Expanding Signal Ping Wave -->
    <circle cx="150" cy="140" r="5" fill="none" stroke="#00E5FF" stroke-width="1" class="expanding-ping" />

    <!-- Rotating Radar Sweep Cone -->
    <g class="radar-sweep" style="transform-origin: 150px 140px;">
      <path d="M 150 140 L 235 140 A 85 85 0 0 0 210 80 Z" fill="url(#sweepGrad)" />
      <line x1="150" y1="140" x2="235" y2="140" stroke="#00E5FF" stroke-width="1.8" filter="url(#blipGlow)" />
    </g>

    <!-- Radar Target 1: Deauth Attack Blocked -->
    <g class="blip-red">
      <circle cx="195" cy="95" r="4.5" fill="#FF5555" filter="url(#blipGlow)" />
      <circle cx="195" cy="95" r="8" fill="none" stroke="#FF5555" stroke-width="0.8" />
    </g>
    <text x="208" y="98" fill="#FF7777" font-family="'JetBrains Mono', Consolas, monospace" font-size="7.5" font-weight="600">DEAUTH_DETECT</text>

    <!-- Radar Target 2: Anomalous API Request Trapped -->
    <g class="blip-amber">
      <circle cx="105" cy="180" r="4" fill="#FFB800" filter="url(#blipGlow)" />
      <circle cx="105" cy="180" r="7" fill="none" stroke="#FFB800" stroke-width="0.8" />
    </g>
    <text x="52" y="195" fill="#FFB800" font-family="'JetBrains Mono', Consolas, monospace" font-size="7.5" font-weight="600">ANOMALY_HONEYPOT</text>

    <!-- Radar Target 3: Authorized Mesh Client -->
    <g class="blip-green">
      <circle cx="180" cy="175" r="3.5" fill="#B7FF5A" />
    </g>
    <text x="190" y="186" fill="#B7FF5A" font-family="'JetBrains Mono', Consolas, monospace" font-size="7.5">AUTHORIZED</text>
  </g>

  <!-- Divider 1 -->
  <line x1="300" y1="46" x2="300" y2="246" stroke="#1B2838" stroke-width="1" stroke-dasharray="3 4" />

  <!-- ==================== PANEL 2: DEFENSE TELEMETRY & GAUGES ==================== -->
  <g transform="translate(325, 48)">
    <text x="0" y="10" fill="#00E5FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">
      ACTIVE DEFENSIVE TELEMETRY
    </text>

    <!-- Gauge 1: 802.11 Wi-Fi IDS Surveillance -->
    <g transform="translate(0, 24)">
      <text x="0" y="10" fill="#E6EDF3" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">802.11 RF Intrusion Surveillance</text>
      <text x="280" y="10" fill="#00E5FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end">98% CAPACITY</text>
      <rect x="0" y="16" width="280" height="7" rx="3.5" fill="#0D1624" stroke="#162235" stroke-width="1" />
      <rect x="1" y="17" width="272" height="5" rx="2.5" fill="#00E5FF" />
    </g>

    <!-- Gauge 2: ML Anomaly Accuracy -->
    <g transform="translate(0, 66)">
      <text x="0" y="10" fill="#E6EDF3" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">Ghost-Guard Isolation Forest Accuracy</text>
      <text x="280" y="10" fill="#B7FF5A" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end">96.4% ACC</text>
      <rect x="0" y="16" width="280" height="7" rx="3.5" fill="#0D1624" stroke="#162235" stroke-width="1" />
      <rect x="1" y="17" width="268" height="5" rx="2.5" fill="#B7FF5A" />
    </g>

    <!-- Gauge 3: Cryptographic Cipher Strength -->
    <g transform="translate(0, 108)">
      <text x="0" y="10" fill="#E6EDF3" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">E2EE Cryptographic Entropy (AES-256)</text>
      <text x="280" y="10" fill="#00E5FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end">256-BIT MAX</text>
      <rect x="0" y="16" width="280" height="7" rx="3.5" fill="#0D1624" stroke="#162235" stroke-width="1" />
      <rect x="1" y="17" width="278" height="5" rx="2.5" fill="#00E5FF" />
    </g>

    <!-- Gauge 4: Zero-Trust Gateway Tunnel Uptime -->
    <g transform="translate(0, 150)">
      <text x="0" y="10" fill="#E6EDF3" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">Mornye Zero-Trust Tunnel Uptime</text>
      <text x="280" y="10" fill="#B7FF5A" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end">99.98% SLA</text>
      <rect x="0" y="16" width="280" height="7" rx="3.5" fill="#0D1624" stroke="#162235" stroke-width="1" />
      <rect x="1" y="17" width="276" height="5" rx="2.5" fill="#B7FF5A" />
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="640" y1="46" x2="640" y2="246" stroke="#1B2838" stroke-width="1" stroke-dasharray="3 4" />

  <!-- ==================== PANEL 3: IDENTITY & OPERATIONAL CLEARANCE ==================== -->
  <g transform="translate(665, 48)">
    <text x="0" y="10" fill="#00E5FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">
      OPERATOR PROFILE &amp; CREDENTIALS
    </text>

    <!-- Identity Information List -->
    <g transform="translate(0, 24)" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">
      <text x="0" y="10" fill="#8793A5">OPERATOR:</text>
      <text x="85" y="10" fill="#FFFFFF" font-weight="600">Dinesh Patra</text>

      <text x="0" y="28" fill="#8793A5">HANDLE:</text>
      <text x="85" y="28" fill="#00E5FF" font-weight="600">@navyaXdev</text>

      <text x="0" y="46" fill="#8793A5">EDUCATION:</text>
      <text x="85" y="46" fill="#E6EDF3">B.Sc. (1st Year) Comp Sci</text>

      <text x="0" y="64" fill="#8793A5">HONORS:</text>
      <text x="85" y="64" fill="#B7FF5A" font-weight="600">NYC CodeQuest R3 Qualifier</text>

      <text x="0" y="82" fill="#8793A5">NATIONAL:</text>
      <text x="85" y="82" fill="#E6EDF3">Smart India Hackathon (SIH)</text>

      <text x="0" y="100" fill="#8793A5">STATUS:</text>
      <text x="85" y="100" fill="#B7FF5A" font-weight="600">Available for Opportunities</text>
    </g>

    <!-- Animated Heartbeat / EKG Pulse Line -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="265" height="38" rx="4" fill="#06090F" stroke="#162235" stroke-width="1" />
      <text x="8" y="14" fill="#8793A5" font-family="'JetBrains Mono', monospace" font-size="8">TELEMETRY_HEARTBEAT // OK</text>
      <path d="M 8 28 L 60 28 L 70 20 L 78 35 L 86 16 L 94 30 L 102 28 L 150 28 L 160 20 L 168 35 L 176 16 L 184 30 L 192 28 L 255 28" 
            fill="none" stroke="#00E5FF" stroke-width="1.4" class="ekg-line" />
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients: Deep Luxury Obsidian -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0D" />
      <stop offset="50%" stop-color="#0E1218" />
      <stop offset="100%" stop-color="#07090C" />
    </linearGradient>

    <!-- Radial Center Glow for Depth -->
    <radialGradient id="centerGlow" cx="72%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#66D9EF" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#BFC8D2" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#080A0D" stop-opacity="0" />
    </radialGradient>

    <!-- Platinum Accent Gradient -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#66D9EF" />
      <stop offset="50%" stop-color="#BFC8D2" />
      <stop offset="100%" stop-color="#F2F4F7" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161C24" />
      <stop offset="100%" stop-color="#0E131A" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarSweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66D9EF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#BFC8D2" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#BFC8D2" stop-opacity="0" />
    </radialGradient>

    <!-- Precision Technical Grid Pattern -->
    <pattern id="precisionGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#161C24" stroke-width="0.75" />
      <circle cx="28" cy="28" r="0.6" fill="#29323E" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Node Floating and Orbit Animations */
    @keyframes floatCenter {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(0, -5px); }
    }
    @keyframes floatA {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-6px, 8px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(7px, -6px); }
    }
    @keyframes floatC {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-5px, -7px); }
    }
    @keyframes floatD {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(6px, 7px); }
    }

    /* Radar Sweep and Packet Streams */
    @keyframes sweep360 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes packetFlowForward {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes packetFlowReverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 240; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(0.96); }
      50% { opacity: 0.9; transform: scale(1.04); }
    }
    @keyframes scanBeam {
      0% { transform: translateY(-380px); opacity: 0; }
      25% { opacity: 0.35; }
      75% { opacity: 0.35; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .node-hub { animation: floatCenter 6s ease-in-out infinite; }
    .node-1   { animation: floatA 7s ease-in-out infinite; }
    .node-2   { animation: floatB 6.5s ease-in-out infinite; }
    .node-3   { animation: floatC 8s ease-in-out infinite; }
    .node-4   { animation: floatD 7.5s ease-in-out infinite; }

    .radar-rotator {
      transform-origin: 730px 190px;
      animation: sweep360 10s linear infinite;
    }
    .packet-stream-1 {
      stroke-dasharray: 6 18;
      animation: packetFlowForward 3s linear infinite;
    }
    .packet-stream-2 {
      stroke-dasharray: 6 18;
      animation: packetFlowReverse 3.6s linear infinite;
    }
    .scanner-line {
      animation: scanBeam 9s ease-in-out infinite;
    }
    .pulse-dot {
      transform-origin: center;
      animation: pulseGlow 2.4s ease-in-out infinite;
    }
    .cursor-element {
      animation: cursorBlink 1s step-end infinite;
    }
  </style>

  <!-- Frame Background -->
  <rect x="0" y="0" width="960" height="380" rx="12" fill="url(#obsidianBg)" stroke="#29323E" stroke-width="1.2" />

  <!-- Technical Precision Grid -->
  <rect x="2" y="2" width="956" height="376" rx="10" fill="url(#precisionGrid)" />

  <!-- Depth Spotlight Behind Network Topology -->
  <rect x="500" y="2" width="458" height="376" rx="10" fill="url(#centerGlow)" />

  <!-- Smooth Scanning Beam Line -->
  <line x1="0" y1="0" x2="960" y2="0" stroke="url(#platinumGrad)" stroke-width="1.2" class="scanner-line" opacity="0.35" />

  <!-- Minimal Top Header Bar -->
  <rect x="0" y="0" width="960" height="38" rx="12" fill="#11151B" />
  <rect x="0" y="28" width="960" height="10" fill="#11151B" />
  <line x1="0" y1="38" x2="960" y2="38" stroke="#29323E" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="22" cy="19" r="4.5" fill="#2D3748" />
  <circle cx="38" cy="19" r="4.5" fill="#4A5568" />
  <circle cx="54" cy="19" r="4.5" fill="#BFC8D2" />

  <!-- Header Text -->
  <text x="78" y="23" fill="#929DAA" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500">
    DINESH PATRA <tspan fill="#29323E">|</tspan> <tspan fill="#F2F4F7">@navyaXdev</tspan> <tspan fill="#29323E">|</tspan> <tspan fill="#BFC8D2">COMPUTER SCIENCE STUDENT · TECH EXPLORER</tspan>
  </text>

  <!-- Status Badge (Top Right) -->
  <g transform="translate(790, 10)">
    <rect x="0" y="0" width="150" height="20" rx="10" fill="#161C24" stroke="#29323E" stroke-width="1" />
    <circle cx="14" cy="10" r="3" fill="#66D9EF" class="pulse-dot" filter="url(#luxuryGlow)" />
    <text x="25" y="14" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" letter-spacing="0.8">STATUS // LEARNING</text>
  </g>

  <!-- Corner Reticles -->
  <path d="M 14 52 L 14 45 L 21 45" fill="none" stroke="#BFC8D2" stroke-width="1.2" opacity="0.4" />
  <path d="M 946 52 L 946 45 L 939 45" fill="none" stroke="#BFC8D2" stroke-width="1.2" opacity="0.4" />
  <path d="M 14 366 L 14 373 L 21 373" fill="none" stroke="#BFC8D2" stroke-width="1.2" opacity="0.4" />
  <path d="M 946 366 L 946 373 L 939 373" fill="none" stroke="#BFC8D2" stroke-width="1.2" opacity="0.4" />

  <!-- ==================== LEFT COLUMN: EDITORIAL IDENTITY ==================== -->
  <g transform="translate(40, 68)">
    <!-- Identity Badge -->
    <rect x="0" y="0" width="205" height="20" rx="4" fill="#11151B" stroke="#29323E" stroke-width="1" />
    <text x="10" y="14" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1">
      B.SC. COMPUTER SCIENCE STUDENT
    </text>

    <!-- Name Title -->
    <text x="0" y="56" fill="#F2F4F7" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="36" font-weight="700" letter-spacing="1">
      DINESH PATRA
    </text>

    <!-- Role Sub-line -->
    <text x="0" y="82" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="500">
      Exploring Ethical Hacking, Machine Learning &amp; Technology
    </text>

    <!-- Authentic Summary Statement -->
    <text x="0" y="112" fill="#929DAA" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">
      Student exploring how systems work from fundamentals, experimenting
    </text>
    <text x="0" y="130" fill="#929DAA" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">
      with new ideas, and building practical projects with AI assistance.
    </text>

    <!-- Learning & Exploration Areas Chips -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="205" height="32" rx="5" fill="#11151B" stroke="#29323E" stroke-width="1" />
      <circle cx="14" cy="16" r="3.5" fill="#66D9EF" />
      <text x="26" y="15" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Linux Fundamentals</text>
      <text x="26" y="26" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="8">Commands &amp; Server Setup</text>

      <rect x="215" y="0" width="225" height="32" rx="5" fill="#11151B" stroke="#29323E" stroke-width="1" />
      <circle cx="229" cy="16" r="3.5" fill="#BFC8D2" />
      <text x="241" y="15" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Python Scripting</text>
      <text x="241" y="26" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="8">Automation &amp; Logic</text>

      <rect x="0" y="40" width="205" height="32" rx="5" fill="#11151B" stroke="#29323E" stroke-width="1" />
      <circle cx="14" cy="56" r="3.5" fill="#BFC8D2" />
      <text x="26" y="55" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Networking Basics</text>
      <text x="26" y="66" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="8">TCP/IP &amp; Protocols</text>

      <rect x="215" y="40" width="225" height="32" rx="5" fill="#11151B" stroke="#29323E" stroke-width="1" />
      <circle cx="229" cy="56" r="3.5" fill="#66D9EF" />
      <text x="241" y="55" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Ethical Hacking &amp; ML</text>
      <text x="241" y="66" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="8">Concepts &amp; Experiments</text>
    </g>

    <!-- Primary Portfolio CTA Button -->
    <g transform="translate(0, 240)">
      <a href="https://portfolio.navya.dpdns.org/" target="_blank">
        <rect x="0" y="0" width="210" height="32" rx="6" fill="url(#btnGrad)" stroke="#BFC8D2" stroke-width="1.2" />
        <text x="16" y="20" fill="#F2F4F7" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.5">
          EXPLORE PORTFOLIO ↗
        </text>
      </a>

      <!-- Compact Status Readout -->
      <rect x="220" y="0" width="220" height="32" rx="6" fill="#0A0D12" stroke="#29323E" stroke-width="1" />
      <text x="232" y="20" fill="#929DAA" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">
        <tspan fill="#66D9EF">student@lab:</tspan> learning <tspan fill="#BFC8D2" class="cursor-element">█</tspan>
      </text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="505" y1="56" x2="505" y2="360" stroke="#29323E" stroke-width="1" stroke-dasharray="3 4" />

  <!-- ==================== RIGHT COLUMN: ANIMATED LEARNING MAP ==================== -->
  <g transform="translate(525, 54)">
    <text x="10" y="14" fill="#929DAA" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1">
      EXPLORATION // ACTIVE LEARNING NODES
    </text>
    <text x="390" y="14" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="500" text-anchor="end">
      HANDS-ON PROJECTS
    </text>

    <!-- Radar Range Rings (Center: 205, 145) -->
    <g transform="translate(205, 145)">
      <circle cx="0" cy="0" r="125" fill="none" stroke="#161C24" stroke-width="1" stroke-dasharray="3 4" />
      <circle cx="0" cy="0" r="80" fill="none" stroke="#1D242E" stroke-width="1" />
      <circle cx="0" cy="0" r="38" fill="none" stroke="#29323E" stroke-width="1" />

      <!-- Crosshairs -->
      <line x1="-130" y1="0" x2="130" y2="0" stroke="#161C24" stroke-width="0.8" />
      <line x1="0" y1="-130" x2="0" y2="130" stroke="#161C24" stroke-width="0.8" />

      <!-- Subtle Expanding Radar Ping -->
      <circle cx="0" cy="0" r="10" fill="none" stroke="#BFC8D2" stroke-width="1.2" opacity="0.6">
        <animate attributeName="r" values="10;125" dur="4.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;0" dur="4.2s" repeatCount="indefinite" />
      </circle>

      <!-- Smooth Rotating Radar Sweep Cone -->
      <g class="radar-rotator" style="transform-origin: 0px 0px;">
        <path d="M 0 0 L 125 0 A 125 125 0 0 0 88 -88 Z" fill="url(#radarSweepGrad)" />
        <line x1="0" y1="0" x2="125" y2="0" stroke="#BFC8D2" stroke-width="1.2" opacity="0.75" />
      </g>
    </g>

    <!-- Network Connections -->
    <line x1="205" y1="145" x2="85" y2="75" stroke="#222B37" stroke-width="1.2" />
    <line x1="205" y1="145" x2="325" y2="75" stroke="#222B37" stroke-width="1.2" />
    <line x1="205" y1="145" x2="75" y2="220" stroke="#222B37" stroke-width="1.2" />
    <line x1="205" y1="145" x2="335" y2="220" stroke="#222B37" stroke-width="1.2" />
    <line x1="85" y1="75" x2="325" y2="75" stroke="#171D25" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="75" y1="220" x2="335" y2="220" stroke="#171D25" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Animated Data Packet Streams -->
    <line x1="205" y1="145" x2="85" y2="75" stroke="#66D9EF" stroke-width="1.8" class="packet-stream-1" opacity="0.85" />
    <line x1="205" y1="145" x2="325" y2="75" stroke="#BFC8D2" stroke-width="1.8" class="packet-stream-2" opacity="0.85" />
    <line x1="205" y1="145" x2="75" y2="220" stroke="#66D9EF" stroke-width="1.6" class="packet-stream-2" opacity="0.75" />
    <line x1="205" y1="145" x2="335" y2="220" stroke="#BFC8D2" stroke-width="1.6" class="packet-stream-1" opacity="0.75" />

    <!-- Node 1: Linux & Shell (Floating) -->
    <g class="node-1">
      <g transform="translate(85, 75)">
        <circle cx="0" cy="0" r="14" fill="#11151B" stroke="#66D9EF" stroke-width="1.2" />
        <circle cx="0" cy="0" r="4" fill="#66D9EF" />
        <text x="0" y="-18" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle">LINUX_SYS</text>
        <text x="0" y="24" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">Server &amp; Shell</text>
      </g>
    </g>

    <!-- Node 2: Python (Floating) -->
    <g class="node-2">
      <g transform="translate(325, 75)">
        <circle cx="0" cy="0" r="14" fill="#11151B" stroke="#BFC8D2" stroke-width="1.2" />
        <circle cx="0" cy="0" r="4" fill="#BFC8D2" />
        <text x="0" y="-18" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle">PYTHON</text>
        <text x="0" y="24" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">Automation</text>
      </g>
    </g>

    <!-- Node 3: Networking (Floating) -->
    <g class="node-3">
      <g transform="translate(75, 220)">
        <circle cx="0" cy="0" r="13" fill="#11151B" stroke="#66D9EF" stroke-width="1.2" />
        <circle cx="0" cy="0" r="3.5" fill="#66D9EF" />
        <text x="0" y="24" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle">NETWORKING</text>
      </g>
    </g>

    <!-- Node 4: Ethical Hacking & ML (Floating) -->
    <g class="node-4">
      <g transform="translate(335, 220)">
        <circle cx="0" cy="0" r="13" fill="#11151B" stroke="#BFC8D2" stroke-width="1.2" />
        <circle cx="0" cy="0" r="3.5" fill="#BFC8D2" />
        <text x="0" y="24" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle">SECURITY_ML</text>
      </g>
    </g>

    <!-- Center Node: Student Project Lab (Floating Hub) -->
    <g class="node-hub">
      <g transform="translate(205, 145)">
        <circle cx="0" cy="0" r="22" fill="#11151B" stroke="#BFC8D2" stroke-width="1.8" filter="url(#luxuryGlow)" />
        <circle cx="0" cy="0" r="16" fill="#161C24" stroke="#66D9EF" stroke-width="1" stroke-dasharray="2 3" />
        <circle cx="0" cy="0" r="5" fill="#F2F4F7" />
        <text x="0" y="36" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1">PROJECT_LAB</text>
      </g>
    </g>

    <!-- Bottom Readout Strip -->
    <g transform="translate(10, 288)">
      <rect x="0" y="0" width="390" height="20" rx="4" fill="#0C0F14" stroke="#29323E" stroke-width="1" />
      <text x="12" y="14" fill="#929DAA" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5">
        PATH: <tspan fill="#F2F4F7">STUDENT</tspan> · APPROACH: <tspan fill="#66D9EF">LEARNING BY BUILDING</tspan> · AI-ASSISTED: <tspan fill="#BFC8D2">YES</tspan>
      </text>
    </g>
  </g>
</svg>

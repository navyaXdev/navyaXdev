<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="100%" stop-color="#05070C" />
    </linearGradient>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes lineFade1 { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade2 { 0%, 12% { opacity: 0; } 22% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade3 { 0%, 24% { opacity: 0; } 34% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade4 { 0%, 36% { opacity: 0; } 46% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade5 { 0%, 48% { opacity: 0; } 58% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade6 { 0%, 60% { opacity: 0; } 70% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade7 { 0%, 72% { opacity: 0; } 82% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade8 { 0%, 84% { opacity: 0; } 92% { opacity: 1; } 100% { opacity: 1; } }

    .line-1 { animation: lineFade1 8s ease-in-out infinite; }
    .line-2 { animation: lineFade2 8s ease-in-out infinite; }
    .line-3 { animation: lineFade3 8s ease-in-out infinite; }
    .line-4 { animation: lineFade4 8s ease-in-out infinite; }
    .line-5 { animation: lineFade5 8s ease-in-out infinite; }
    .line-6 { animation: lineFade6 8s ease-in-out infinite; }
    .line-7 { animation: lineFade7 8s ease-in-out infinite; }
    .line-8 { animation: lineFade8 8s ease-in-out infinite; }

    .cursor { animation: termBlink 0.9s step-end infinite; }
  </style>

  <!-- Outer Window Frame -->
  <rect x="0" y="0" width="960" height="260" rx="10" fill="url(#termBg)" stroke="#1B2838" stroke-width="1.5" />

  <!-- Terminal Window Title Bar -->
  <rect x="0" y="0" width="960" height="38" rx="10" fill="#0D1320" />
  <rect x="0" y="28" width="960" height="10" fill="#0D1320" />
  <line x1="0" y1="38" x2="960" y2="38" stroke="#1B2838" stroke-width="1" />

  <!-- Window Control Buttons -->
  <circle cx="22" cy="19" r="4.5" fill="#FF5F56" />
  <circle cx="38" cy="19" r="4.5" fill="#FFBD2E" />
  <circle cx="54" cy="19" r="4.5" fill="#27C93F" />

  <!-- Terminal Title -->
  <text x="80" y="23" fill="#8793A5" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">
    operator@navyaxdev-core: ~/security-bootstrap.sh <tspan fill="#00E5FF">[BASH / LINUX 6.6 KERNEL]</tspan>
  </text>
  <text x="935" y="23" fill="#00E5FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="end" font-weight="600">
    PID: 4096 // TTY1
  </text>

  <!-- Terminal Console Output Lines -->
  <g transform="translate(24, 64)" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5">
    
    <!-- Line 1: Initializing -->
    <g class="line-1">
      <text x="0" y="0" fill="#8793A5">[0.0012s]</text>
      <text x="75" y="0" fill="#00E5FF" font-weight="700">[SYS_INIT]</text>
      <text x="160" y="0" fill="#E6EDF3">Initializing security environment for operator: <tspan fill="#B7FF5A" font-weight="700">Dinesh Patra (@navyaXdev)</tspan></text>
      <text x="880" y="0" fill="#B7FF5A" font-weight="700" text-anchor="end">[ OK ]</text>
    </g>

    <!-- Line 2: ESP32 Wi-Fi IDS -->
    <g transform="translate(0, 24)" class="line-2">
      <text x="0" y="0" fill="#8793A5">[0.0384s]</text>
      <text x="75" y="0" fill="#00E5FF" font-weight="700">[HARDWARE]</text>
      <text x="160" y="0" fill="#E6EDF3">IntrusionEye 802.11 monitor engaged: 2.4GHz promiscuous capture daemon</text>
      <text x="880" y="0" fill="#B7FF5A" font-weight="700" text-anchor="end">[ ACTIVE ]</text>
    </g>

    <!-- Line 3: Cryptography -->
    <g transform="translate(0, 48)" class="line-3">
      <text x="0" y="0" fill="#8793A5">[0.0812s]</text>
      <text x="75" y="0" fill="#00E5FF" font-weight="700">[CRYPTO]</text>
      <text x="160" y="0" fill="#E6EDF3">ChatX WebCrypto AES-256-GCM + PBKDF2/Argon2id in-browser encryption vault</text>
      <text x="880" y="0" fill="#B7FF5A" font-weight="700" text-anchor="end">[ READY ]</text>
    </g>

    <!-- Line 4: ML Anomaly Defense -->
    <g transform="translate(0, 72)" class="line-4">
      <text x="0" y="0" fill="#8793A5">[0.1245s]</text>
      <text x="75" y="0" fill="#B7FF5A" font-weight="700">[ML_DEFENSE]</text>
      <text x="160" y="0" fill="#E6EDF3">Ghost-Guard Isolation Forest model loaded (Zero-signature API defense)</text>
      <text x="880" y="0" fill="#B7FF5A" font-weight="700" text-anchor="end">[ TRAINED ]</text>
    </g>

    <!-- Line 5: Phishing Shield -->
    <g transform="translate(0, 96)" class="line-5">
      <text x="0" y="0" fill="#8793A5">[0.1690s]</text>
      <text x="75" y="0" fill="#00E5FF" font-weight="700">[HEURISTICS]</text>
      <text x="160" y="0" fill="#E6EDF3">Safora real-time URL tokenizer + explainable risk classifier activated</text>
      <text x="880" y="0" fill="#B7FF5A" font-weight="700" text-anchor="end">[ ONLINE ]</text>
    </g>

    <!-- Line 6: Zero Trust Storage -->
    <g transform="translate(0, 120)" class="line-6">
      <text x="0" y="0" fill="#8793A5">[0.2105s]</text>
      <text x="75" y="0" fill="#8793A5" font-weight="700">[STORAGE]</text>
      <text x="160" y="0" fill="#E6EDF3">Mornye-Network-Storage RFC 4918 WebDAV verified over Cloudflare Tunnel</text>
      <text x="880" y="0" fill="#B7FF5A" font-weight="700" text-anchor="end">[ VERIFIED ]</text>
    </g>

    <!-- Line 7: System Ready -->
    <g transform="translate(0, 144)" class="line-7">
      <text x="0" y="0" fill="#8793A5">[0.2540s]</text>
      <text x="75" y="0" fill="#B7FF5A" font-weight="700">[STATUS]</text>
      <text x="160" y="0" fill="#00E5FF" font-weight="700">PROFILE INITIALIZATION COMPLETE // DEFENSE POSTURE: HARDENED</text>
      <text x="880" y="0" fill="#00E5FF" font-weight="700" text-anchor="end">[ 100% ]</text>
    </g>

    <!-- Line 8: Interactive Prompt -->
    <g transform="translate(0, 168)" class="line-8">
      <text x="0" y="0" fill="#00E5FF" font-weight="700">navyaXdev@cyberops-kernel:~$</text>
      <text x="240" y="0" fill="#FFFFFF">cat ./identity.txt | openssl dgst -sha256</text>
      <text x="600" y="0" fill="#B7FF5A" class="cursor">█</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080A0D" />
      <stop offset="100%" stop-color="#050709" />
    </linearGradient>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes lineFade1 { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade2 { 0%, 12% { opacity: 0; } 22% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade3 { 0%, 24% { opacity: 0; } 34% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade4 { 0%, 36% { opacity: 0; } 46% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade5 { 0%, 48% { opacity: 0; } 58% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade6 { 0%, 60% { opacity: 0; } 70% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade7 { 0%, 72% { opacity: 0; } 82% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade8 { 0%, 84% { opacity: 0; } 92% { opacity: 1; } 100% { opacity: 1; } }

    .line-1 { animation: lineFade1 9s ease-in-out infinite; }
    .line-2 { animation: lineFade2 9s ease-in-out infinite; }
    .line-3 { animation: lineFade3 9s ease-in-out infinite; }
    .line-4 { animation: lineFade4 9s ease-in-out infinite; }
    .line-5 { animation: lineFade5 9s ease-in-out infinite; }
    .line-6 { animation: lineFade6 9s ease-in-out infinite; }
    .line-7 { animation: lineFade7 9s ease-in-out infinite; }
    .line-8 { animation: lineFade8 9s ease-in-out infinite; }

    .cursor { animation: termBlink 0.9s step-end infinite; }
  </style>

  <!-- Window Frame -->
  <rect x="0" y="0" width="960" height="260" rx="10" fill="url(#termBg)" stroke="#29323E" stroke-width="1.2" />

  <!-- Window Title Bar -->
  <rect x="0" y="0" width="960" height="38" rx="10" fill="#11151B" />
  <rect x="0" y="28" width="960" height="10" fill="#11151B" />
  <line x1="0" y1="38" x2="960" y2="38" stroke="#29323E" stroke-width="1" />

  <!-- Metallic Control Buttons -->
  <circle cx="22" cy="19" r="4.5" fill="#3D4754" />
  <circle cx="38" cy="19" r="4.5" fill="#5C6878" />
  <circle cx="54" cy="19" r="4.5" fill="#BFC8D2" />

  <!-- Window Title -->
  <text x="80" y="23" fill="#929DAA" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">
    operator@navyaxdev-telemetry: ~/initialize-environment.sh <tspan fill="#66D9EF">[PORTFOLIO INTEGRATED]</tspan>
  </text>
  <text x="935" y="23" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="end" font-weight="500">
    TTY1 // SECURE_SHELL
  </text>

  <!-- Console Text Lines -->
  <g transform="translate(24, 64)" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5">
    
    <!-- Line 1: Init -->
    <g class="line-1">
      <text x="0" y="0" fill="#929DAA">[0.0012s]</text>
      <text x="75" y="0" fill="#BFC8D2" font-weight="700">[SYS_INIT]</text>
      <text x="165" y="0" fill="#F2F4F7">Initializing secure runtime for operator: <tspan fill="#66D9EF" font-weight="700">Dinesh Patra (@navyaXdev)</tspan></text>
      <text x="880" y="0" fill="#BFC8D2" font-weight="600" text-anchor="end">[ OK ]</text>
    </g>

    <!-- Line 2: Portfolio Link -->
    <g transform="translate(0, 24)" class="line-2">
      <text x="0" y="0" fill="#929DAA">[0.0384s]</text>
      <text x="75" y="0" fill="#66D9EF" font-weight="700">[PORTFOLIO]</text>
      <text x="165" y="0" fill="#F2F4F7">Official portfolio connected: <tspan fill="#BFC8D2" font-weight="600">https://portfolio.navya.dpdns.org/</tspan></text>
      <text x="880" y="0" fill="#66D9EF" font-weight="600" text-anchor="end">[ 200 OK ]</text>
    </g>

    <!-- Line 3: ESP32 Hardware -->
    <g transform="translate(0, 48)" class="line-3">
      <text x="0" y="0" fill="#929DAA">[0.0812s]</text>
      <text x="75" y="0" fill="#BFC8D2" font-weight="700">[HARDWARE]</text>
      <text x="165" y="0" fill="#F2F4F7">IntrusionEye 802.11 monitor engaged: ESP32 promiscuous capture daemon</text>
      <text x="880" y="0" fill="#BFC8D2" font-weight="600" text-anchor="end">[ ACTIVE ]</text>
    </g>

    <!-- Line 4: Cryptography -->
    <g transform="translate(0, 72)" class="line-4">
      <text x="0" y="0" fill="#929DAA">[0.1245s]</text>
      <text x="75" y="0" fill="#BFC8D2" font-weight="700">[CRYPTO]</text>
      <text x="165" y="0" fill="#F2F4F7">ChatX client-side WebCrypto AES-256-GCM zero-knowledge vault online</text>
      <text x="880" y="0" fill="#BFC8D2" font-weight="600" text-anchor="end">[ READY ]</text>
    </g>

    <!-- Line 5: ML Anomaly -->
    <g transform="translate(0, 96)" class="line-5">
      <text x="0" y="0" fill="#929DAA">[0.1690s]</text>
      <text x="75" y="0" fill="#BFC8D2" font-weight="700">[ML_DEFENSE]</text>
      <text x="165" y="0" fill="#F2F4F7">Ghost-Guard Isolation Forest model armed (Unsupervised API honeypot layer)</text>
      <text x="880" y="0" fill="#BFC8D2" font-weight="600" text-anchor="end">[ TRAINED ]</text>
    </g>

    <!-- Line 6: Zero Trust Storage -->
    <g transform="translate(0, 120)" class="line-6">
      <text x="0" y="0" fill="#929DAA">[0.2105s]</text>
      <text x="75" y="0" fill="#929DAA" font-weight="700">[STORAGE]</text>
      <text x="165" y="0" fill="#F2F4F7">Mornye-Network-Storage RFC 4918 WebDAV verified over Cloudflare Tunnel</text>
      <text x="880" y="0" fill="#BFC8D2" font-weight="600" text-anchor="end">[ VERIFIED ]</text>
    </g>

    <!-- Line 7: Status -->
    <g transform="translate(0, 144)" class="line-7">
      <text x="0" y="0" fill="#929DAA">[0.2540s]</text>
      <text x="75" y="0" fill="#66D9EF" font-weight="700">[STATUS]</text>
      <text x="165" y="0" fill="#BFC8D2" font-weight="600">ENVIRONMENT INITIALIZATION COMPLETE // LUXURY DEFENSE POSTURE: HARDENED</text>
      <text x="880" y="0" fill="#F2F4F7" font-weight="600" text-anchor="end">[ 100% ]</text>
    </g>

    <!-- Line 8: Interactive Prompt -->
    <g transform="translate(0, 168)" class="line-8">
      <text x="0" y="0" fill="#66D9EF" font-weight="700">navyaXdev@telemetry:~$</text>
      <text x="195" y="0" fill="#F2F4F7">curl -sI https://portfolio.navya.dpdns.org/ | grep HTTP</text>
      <text x="640" y="0" fill="#BFC8D2" class="cursor">█</text>
    </g>
  </g>
</svg>

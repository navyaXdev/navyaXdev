<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <defs>
    <linearGradient id="termDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080A0D" />
      <stop offset="100%" stop-color="#06080B" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes lineFade1 { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade2 { 0%, 15% { opacity: 0; } 28% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade3 { 0%, 32% { opacity: 0; } 45% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade4 { 0%, 48% { opacity: 0; } 62% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes lineFade5 { 0%, 65% { opacity: 0; } 80% { opacity: 1; } 100% { opacity: 1; } }

    .line-1 { animation: lineFade1 8s ease-in-out infinite; }
    .line-2 { animation: lineFade2 8s ease-in-out infinite; }
    .line-3 { animation: lineFade3 8s ease-in-out infinite; }
    .line-4 { animation: lineFade4 8s ease-in-out infinite; }
    .line-5 { animation: lineFade5 8s ease-in-out infinite; }
    .cursor { animation: blinkCursor 1s step-end infinite; }
  </style>

  <!-- Terminal Window Frame -->
  <rect x="0" y="0" width="960" height="170" rx="10" fill="url(#termDarkBg)" stroke="#29323E" stroke-width="1.2" />

  <!-- Terminal Title Bar -->
  <rect x="0" y="0" width="960" height="34" rx="10" fill="#11151B" />
  <rect x="0" y="24" width="960" height="10" fill="#11151B" />
  <line x1="0" y1="34" x2="960" y2="34" stroke="#29323E" stroke-width="1" />

  <!-- Metallic Control Buttons -->
  <circle cx="20" cy="17" r="4" fill="#2D3748" />
  <circle cx="34" cy="17" r="4" fill="#4A5568" />
  <circle cx="48" cy="17" r="4" fill="#BFC8D2" />

  <!-- Title Text -->
  <text x="72" y="21" fill="#929DAA" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">
    student@navyaxdev-lab: ~/explore-tech.sh <tspan fill="#66D9EF">[PORTFOLIO CONNECTED]</tspan>
  </text>
  <text x="940" y="21" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="end" font-weight="500">
    B.SC. CS STUDENT
  </text>

  <!-- Terminal Output Lines -->
  <g transform="translate(24, 58)" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5">
    
    <!-- Line 1: Identity -->
    <g class="line-1">
      <text x="0" y="0" fill="#929DAA">[0.00s]</text>
      <text x="70" y="0" fill="#BFC8D2" font-weight="700">[IDENTITY]</text>
      <text x="160" y="0" fill="#F2F4F7">Dinesh Patra (<tspan fill="#66D9EF" font-weight="600">@navyaXdev</tspan>) · First-Year B.Sc. Computer Science</text>
      <text x="895" y="0" fill="#BFC8D2" font-weight="600" text-anchor="end">[ ACTIVE ]</text>
    </g>

    <!-- Line 2: Learning Focus -->
    <g transform="translate(0, 22)" class="line-2">
      <text x="0" y="0" fill="#929DAA">[0.04s]</text>
      <text x="70" y="0" fill="#66D9EF" font-weight="700">[LEARNING]</text>
      <text x="160" y="0" fill="#F2F4F7">Building fundamentals in Linux, Python scripting, and Networking</text>
      <text x="895" y="0" fill="#66D9EF" font-weight="600" text-anchor="end">[ PROGRESS ]</text>
    </g>

    <!-- Line 3: Exploring Interests -->
    <g transform="translate(0, 44)" class="line-3">
      <text x="0" y="0" fill="#929DAA">[0.08s]</text>
      <text x="70" y="0" fill="#BFC8D2" font-weight="700">[EXPLORING]</text>
      <text x="160" y="0" fill="#F2F4F7">Exploring Ethical Hacking, Penetration Testing &amp; Machine Learning</text>
      <text x="895" y="0" fill="#BFC8D2" font-weight="600" text-anchor="end">[ EXPLORING ]</text>
    </g>

    <!-- Line 4: Hands-on Approach -->
    <g transform="translate(0, 66)" class="line-4">
      <text x="0" y="0" fill="#929DAA">[0.12s]</text>
      <text x="70" y="0" fill="#BFC8D2" font-weight="700">[APPROACH]</text>
      <text x="160" y="0" fill="#F2F4F7">Turning real ideas into practical projects using hands-on AI-assisted building</text>
      <text x="895" y="0" fill="#BFC8D2" font-weight="600" text-anchor="end">[ BUILDING ]</text>
    </g>

    <!-- Line 5: Interactive Prompt -->
    <g transform="translate(0, 88)" class="line-5">
      <text x="0" y="0" fill="#66D9EF" font-weight="700">navyaXdev:~$</text>
      <text x="110" y="0" fill="#F2F4F7">echo "Curious about systems. Learning by building."</text>
      <text x="560" y="0" fill="#BFC8D2" class="cursor">█</text>
      <text x="895" y="0" fill="#F2F4F7" font-weight="600" text-anchor="end">[ 2026 ]</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 145" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGradClean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11151B" />
      <stop offset="100%" stop-color="#0B0E13" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="960" height="145" rx="8" fill="#080A0D" stroke="#29323E" stroke-width="1.2" />

  <!-- Column 1: Core Fundamentals -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="300" height="113" rx="6" fill="url(#cardGradClean)" stroke="#29323E" stroke-width="1" />
    <rect x="0" y="0" width="300" height="3" rx="1.5" fill="#66D9EF" />
    <text x="16" y="24" fill="#66D9EF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">01 // CURRENTLY LEARNING</text>
    
    <g transform="translate(16, 44)" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">
      <circle cx="4" cy="6" r="2.5" fill="#BFC8D2" />
      <text x="14" y="10" fill="#F2F4F7">Linux <tspan fill="#929DAA">· Commands &amp; Server Setup</tspan></text>
      
      <circle cx="4" cy="28" r="2.5" fill="#66D9EF" />
      <text x="14" y="32" fill="#F2F4F7">Python <tspan fill="#929DAA">· Scripting &amp; Automation</tspan></text>
      
      <circle cx="4" cy="50" r="2.5" fill="#BFC8D2" />
      <text x="14" y="54" fill="#F2F4F7">Networking <tspan fill="#929DAA">· TCP/IP, Ports &amp; Protocols</tspan></text>
    </g>
  </g>

  <!-- Column 2: Exploring Cybersecurity -->
  <g transform="translate(330, 16)">
    <rect x="0" y="0" width="300" height="113" rx="6" fill="url(#cardGradClean)" stroke="#29323E" stroke-width="1" />
    <rect x="0" y="0" width="300" height="3" rx="1.5" fill="#BFC8D2" />
    <text x="16" y="24" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">02 // EXPLORING SECURITY</text>
    
    <g transform="translate(16, 44)" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">
      <circle cx="4" cy="6" r="2.5" fill="#BFC8D2" />
      <text x="14" y="10" fill="#F2F4F7">Ethical Hacking <tspan fill="#929DAA">· Core Concepts</tspan></text>
      
      <circle cx="4" cy="28" r="2.5" fill="#66D9EF" />
      <text x="14" y="32" fill="#F2F4F7">Penetration Testing <tspan fill="#929DAA">· Controlled Labs</tspan></text>
      
      <circle cx="4" cy="50" r="2.5" fill="#BFC8D2" />
      <text x="14" y="54" fill="#F2F4F7">Web App Security <tspan fill="#929DAA">· Fundamentals</tspan></text>
    </g>
  </g>

  <!-- Column 3: Exploring ML & Technology -->
  <g transform="translate(644, 16)">
    <rect x="0" y="0" width="300" height="113" rx="6" fill="url(#cardGradClean)" stroke="#29323E" stroke-width="1" />
    <rect x="0" y="0" width="300" height="3" rx="1.5" fill="#66D9EF" />
    <text x="16" y="24" fill="#66D9EF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">03 // EXPLORING ML &amp; TECH</text>
    
    <g transform="translate(16, 44)" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">
      <circle cx="4" cy="6" r="2.5" fill="#BFC8D2" />
      <text x="14" y="10" fill="#F2F4F7">Machine Learning <tspan fill="#929DAA">· Datasets &amp; Basics</tspan></text>
      
      <circle cx="4" cy="28" r="2.5" fill="#66D9EF" />
      <text x="14" y="32" fill="#F2F4F7">Cloudflare Tunnels <tspan fill="#929DAA">· Server Access</tspan></text>
      
      <circle cx="4" cy="50" r="2.5" fill="#BFC8D2" />
      <text x="14" y="54" fill="#F2F4F7">AI-Assisted Building <tspan fill="#929DAA">· Learning by Code</tspan></text>
    </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080A0D" />
      <stop offset="50%" stop-color="#0E1217" />
      <stop offset="100%" stop-color="#080A0D" />
    </linearGradient>

    <linearGradient id="pipeLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#66D9EF" />
      <stop offset="50%" stop-color="#BFC8D2" />
      <stop offset="100%" stop-color="#66D9EF" />
    </linearGradient>
  </defs>

  <style>
    @keyframes conduitFlow {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    .laser-pipe {
      stroke-dasharray: 6 16;
      animation: conduitFlow 2.5s linear infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="0" y="0" width="960" height="140" rx="8" fill="url(#pipeBg)" stroke="#29323E" stroke-width="1.2" />

  <!-- Sub-header -->
  <text x="24" y="24" fill="#929DAA" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1">
    ARCHITECTURE // MULTI-LAYER DEFENSIVE PIPELINE
  </text>
  <text x="936" y="24" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end" font-weight="500">
    STATUS: ENCRYPTED &amp; VERIFIED
  </text>

  <!-- Laser Conduit Lines Behind Modules -->
  <line x1="165" y1="78" x2="800" y2="78" stroke="#171D25" stroke-width="2.5" />
  <line x1="165" y1="78" x2="800" y2="78" stroke="url(#pipeLaser)" stroke-width="2" class="laser-pipe" opacity="0.8" />

  <!-- Animated Data Packet Orbs Traversing the Conduit -->
  <circle cx="200" cy="78" r="3.5" fill="#66D9EF">
    <animate attributeName="cx" values="165;800" dur="4.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="350" cy="78" r="3" fill="#BFC8D2">
    <animate attributeName="cx" values="165;800" dur="4.5s" begin="2.25s" repeatCount="indefinite" />
  </circle>

  <!-- Stage 1: RF IDS -->
  <g transform="translate(24, 42)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#11151B" stroke="#29323E" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="3" rx="1.5" fill="#66D9EF" />
    <text x="12" y="20" fill="#66D9EF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">01 // RF &amp; 802.11</text>
    <text x="12" y="38" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">IntrusionEye</text>
    <text x="12" y="54" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="8.5">Deauth &amp; Beacon Flood</text>
  </g>

  <!-- Stage 2: Crypt Vault -->
  <g transform="translate(212, 42)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#11151B" stroke="#29323E" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="3" rx="1.5" fill="#BFC8D2" />
    <text x="12" y="20" fill="#BFC8D2" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">02 // CRYPTOGRAPHY</text>
    <text x="12" y="38" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ChatX E2EE</text>
    <text x="12" y="54" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="8.5">AES-256-GCM Vault</text>
  </g>

  <!-- Stage 3: ML Anomaly -->
  <g transform="translate(400, 42)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#11151B" stroke="#29323E" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="3" rx="1.5" fill="#66D9EF" />
    <text x="12" y="20" fill="#66D9EF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">03 // ML DETECTION</text>
    <text x="12" y="38" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Ghost-Guard</text>
    <text x="12" y="54" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="8.5">Isolation Forest Engine</text>
  </g>

  <!-- Stage 4: Honeypot Trap -->
  <g transform="translate(588, 42)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#11151B" stroke="#29323E" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="3" rx="1.5" fill="#BFC8D2" />
    <text x="12" y="20" fill="#BFC8D2" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">04 // DECOY LAYER</text>
    <text x="12" y="38" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">API Decoys</text>
    <text x="12" y="54" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="8.5">Attacker Telemetry Trap</text>
  </g>

  <!-- Stage 5: Zero-Trust Gateway -->
  <g transform="translate(776, 42)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#11151B" stroke="#29323E" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="3" rx="1.5" fill="#66D9EF" />
    <text x="12" y="20" fill="#66D9EF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">05 // ZERO TRUST</text>
    <text x="12" y="38" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Mornye NAS</text>
    <text x="12" y="54" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="8.5">WebDAV / Cloudflare</text>
  </g>
</svg>

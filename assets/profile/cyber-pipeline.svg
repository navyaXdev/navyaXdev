<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBgDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080A0D" />
      <stop offset="50%" stop-color="#0E1217" />
      <stop offset="100%" stop-color="#080A0D" />
    </linearGradient>

    <linearGradient id="pipeLaserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#66D9EF" />
      <stop offset="50%" stop-color="#BFC8D2" />
      <stop offset="100%" stop-color="#66D9EF" />
    </linearGradient>
  </defs>

  <style>
    @keyframes conduitFlowSlow {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    .conduit-line {
      stroke-dasharray: 6 18;
      animation: conduitFlowSlow 3s linear infinite;
    }
  </style>

  <!-- Container -->
  <rect x="0" y="0" width="960" height="120" rx="8" fill="url(#pipeBgDark)" stroke="#29323E" stroke-width="1.2" />

  <!-- Sub-header -->
  <text x="24" y="22" fill="#929DAA" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1">
    ARCHITECTURE // 3-TIER DEFENSE PIPELINE
  </text>
  <text x="936" y="22" fill="#BFC8D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end" font-weight="500">
    STATUS: REALTIME SURVEILLANCE
  </text>

  <!-- Laser Conduit Behind Cards -->
  <line x1="160" y1="68" x2="800" y2="68" stroke="#161C24" stroke-width="2.5" />
  <line x1="160" y1="68" x2="800" y2="68" stroke="url(#pipeLaserLine)" stroke-width="2" class="conduit-line" opacity="0.85" />

  <!-- Moving Data Packets -->
  <circle cx="200" cy="68" r="3.5" fill="#66D9EF">
    <animate attributeName="cx" values="160;800" dur="4.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="68" r="3" fill="#BFC8D2">
    <animate attributeName="cx" values="160;800" dur="4.5s" begin="2.25s" repeatCount="indefinite" />
  </circle>

  <!-- Tier 1: IntrusionEye -->
  <g transform="translate(24, 36)">
    <rect x="0" y="0" width="280" height="66" rx="6" fill="#11151B" stroke="#29323E" stroke-width="1.2" />
    <rect x="0" y="0" width="280" height="3" rx="1.5" fill="#66D9EF" />
    <text x="16" y="20" fill="#66D9EF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">01 // RF &amp; WIRELESS IDS</text>
    <text x="16" y="38" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">IntrusionEye</text>
    <text x="16" y="52" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="9">ESP32 802.11 Promiscuous Sniffer</text>
  </g>

  <!-- Tier 2: ChatX -->
  <g transform="translate(340, 36)">
    <rect x="0" y="0" width="280" height="66" rx="6" fill="#11151B" stroke="#29323E" stroke-width="1.2" />
    <rect x="0" y="0" width="280" height="3" rx="1.5" fill="#BFC8D2" />
    <text x="16" y="20" fill="#BFC8D2" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">02 // CLIENT-SIDE CRYPTO</text>
    <text x="16" y="38" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">ChatX E2EE</text>
    <text x="16" y="52" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="9">AES-256-GCM / WebCrypto Vault</text>
  </g>

  <!-- Tier 3: Ghost-Guard -->
  <g transform="translate(656, 36)">
    <rect x="0" y="0" width="280" height="66" rx="6" fill="#11151B" stroke="#29323E" stroke-width="1.2" />
    <rect x="0" y="0" width="280" height="3" rx="1.5" fill="#66D9EF" />
    <text x="16" y="20" fill="#66D9EF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">03 // BEHAVIORAL ML DEFENSE</text>
    <text x="16" y="38" fill="#F2F4F7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Ghost-Guard</text>
    <text x="16" y="52" fill="#929DAA" font-family="'JetBrains Mono', monospace" font-size="9">Isolation Forest API Honeypot</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="50%" stop-color="#0D1424" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>

    <linearGradient id="pipeBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#B7FF5A" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes conduitFlow {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    .laser-pipe {
      stroke-dasharray: 8 16;
      animation: conduitFlow 2s linear infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="0" y="0" width="960" height="140" rx="8" fill="url(#pipeBg)" stroke="#1B2838" stroke-width="1.2" />

  <!-- Sub-header -->
  <text x="24" y="24" fill="#8793A5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">
    ARCHITECTURE // MULTI-LAYER DEFENSE PIPELINE
  </text>
  <text x="936" y="24" fill="#00E5FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end" font-weight="600">
    STATUS: FLOW ENCRYPTED &amp; MONITORED
  </text>

  <!-- Laser Conduit Lines Behind Modules -->
  <line x1="165" y1="78" x2="800" y2="78" stroke="#16253B" stroke-width="3" />
  <line x1="165" y1="78" x2="800" y2="78" stroke="url(#pipeBeam)" stroke-width="2.5" class="laser-pipe" filter="url(#laserGlow)" />

  <!-- Animated Data Packet Orbs Traversing the Conduit -->
  <circle cx="200" cy="78" r="4" fill="#00E5FF" filter="url(#laserGlow)">
    <animate attributeName="cx" values="165;800" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="350" cy="78" r="3.5" fill="#B7FF5A" filter="url(#laserGlow)">
    <animate attributeName="cx" values="165;800" dur="4s" begin="2s" repeatCount="indefinite" />
  </circle>

  <!-- Stage 1: RF IDS -->
  <g transform="translate(24, 42)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#0A1322" stroke="#00E5FF" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="4" rx="2" fill="#00E5FF" />
    <text x="12" y="20" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">01 // RF &amp; 802.11</text>
    <text x="12" y="38" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">IntrusionEye</text>
    <text x="12" y="54" fill="#8793A5" font-family="'JetBrains Mono', monospace" font-size="8.5">Deauth / Beacon Flood</text>
  </g>

  <!-- Stage 2: Crypt Vault -->
  <g transform="translate(212, 42)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#0A1322" stroke="#1B2838" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="4" rx="2" fill="#B7FF5A" />
    <text x="12" y="20" fill="#B7FF5A" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">02 // CRYPTOGRAPHY</text>
    <text x="12" y="38" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ChatX E2EE</text>
    <text x="12" y="54" fill="#8793A5" font-family="'JetBrains Mono', monospace" font-size="8.5">AES-256-GCM Vault</text>
  </g>

  <!-- Stage 3: ML Anomaly -->
  <g transform="translate(400, 42)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#0A1322" stroke="#00E5FF" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="4" rx="2" fill="#00E5FF" />
    <text x="12" y="20" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">03 // ML DETECTION</text>
    <text x="12" y="38" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Ghost-Guard</text>
    <text x="12" y="54" fill="#8793A5" font-family="'JetBrains Mono', monospace" font-size="8.5">Isolation Forest Engine</text>
  </g>

  <!-- Stage 4: Honeypot Trap -->
  <g transform="translate(588, 42)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#0A1322" stroke="#1B2838" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="4" rx="2" fill="#FFB800" />
    <text x="12" y="20" fill="#FFB800" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">04 // DECOY LAYER</text>
    <text x="12" y="38" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">API Decoys</text>
    <text x="12" y="54" fill="#8793A5" font-family="'JetBrains Mono', monospace" font-size="8.5">Attacker Telemetry Trap</text>
  </g>

  <!-- Stage 5: Zero-Trust Gateway -->
  <g transform="translate(776, 42)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#0A1322" stroke="#B7FF5A" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="4" rx="2" fill="#B7FF5A" />
    <text x="12" y="20" fill="#B7FF5A" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">05 // ZERO TRUST</text>
    <text x="12" y="38" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Mornye NAS</text>
    <text x="12" y="54" fill="#8793A5" font-family="'JetBrains Mono', monospace" font-size="8.5">WebDAV / Cloudflare</text>
  </g>
</svg>
